<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Spotify - Web Player: Music for everyone</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,500;1,500&display=swap');
    </style>
</head>
<body class="bg-black text-white ">
     <div class="main flex bg-black">
            <div class="left w-1/4 m-2 max-[1200px]:left-[-120%] max-[1200px]:absolute max-[1200px]:z-10 max-[1200px]:transition-all duration-300 max-[400px]:min-w-[80%] max-[1200px]:m-0 ">
                <!-- calc(100vw - 20px or whatever jitna margin padding ke liye jagah deni hai very useful for consistent dimensions , vw vagera use krke consisitent dimensions rhengi  -->
                <div class="close absolute hidden top-4 left-70 max-[1200px]:block">
                        <img class="invert" src="/src/images/close.svg" alt="">
                    </div>
                <div class="home bg-[#121212] text-white mb-2 p-2.5 rounded-sm">
                    <div class="logo">
                        <img class="invert w-36" src="images/logo.svg" alt="spotify">
                    </div> 
                    <ul class="list-none w-4 pt-4">
                        <li class="w-4 flex gap-2 font-bold"> <img class="invert" src="images/home.svg" alt="Home"> Home </li>
                        <li class="w-4 flex gap-2 font-bold"> <img class="invert" src="images/search.svg" alt="Search"> Search </li>
                    </ul>
                </div>

                <div class="library min-h-[75vh] bg-[#121212] text-white p-2.5 relative rounded-sm ">
                    <div class="heading flex gap-4">
                        <img class="invert w-4" src="/src/images/library.svg" alt="lib icon">
                        <h2 class="font-bold"> Your Library </h2>
                    </div>

                    <div class="songList h-79 scrollbar-sexy overflow-y-auto overflow-x-hidden mb-7">
                        <ol class="p-1 cursor-pointer mt-2">

                        </ol>
                    </div>

                    <div class="footer flex text-[12px] gap-2 text-gray-500 relative bottom-3 flex-wrap">
                    <div><a href="https://www.spotify.com/jp/legal/"><span>Legal</span></a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/"><span>Privacy Center</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/"><span>Privacy Policy</span></a>
                    </div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/"><span>Cookies</span></a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"><span>About Ads</span></a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/"><span>Accessibility</span></a></div>
                </div>
                </div>
            </div>
            <div class="right w-3/4 my-2 relative max-[1200px]:w-full max-[1200px]:m-0">
                <div class="header flex justify-between p-1 bg-[rgb(34,34,34)] mt-0.5">
                    <div class="nav flex">
                        <div class="hamburger hidden max-[1100px]:block">
                            <img class="invert" src="/src/images/hamburger.svg" alt="">
                        </div>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                                stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                    <div class="button px-2 font-bold">
                        <button class="text-gray-500 hover:text-white hover:text-[1.1 rem] cursor-pointer mx-1">Sign Up</button>
                        <button class="mx-1 bg-white rounded-xl text-black px-2 w-16 hover:w-16.5 hover:txt-[1.1 rem] ">Login</button>
                    </div>
                </div>

                <div class="playlists">
                    <h1 class="font-bold pt-2 ml-2">Spotify Playlists</h1>
                    <div class="card_container pt-2.5 flex flex-wrap gap-3 m-3 max-h-[70vh] overflow-y-scroll scrollbar-sexy max-[520px]:justify-center max-[520px]:m-0 ">

                    <div class="playbar bottom-6 bg-[#3e3939] m-auto py-3 w-[calc(70vw-60px)] fixed rounded-3xl max-[1200px]:w-[calc(93vw-2px)] min-h-2 z-0 ">
                        <div class="seekbar w-[90%] absolute bottom-2 left-8 h-1 bg-white rounded-2xl cursor-pointer max-[1200px]:max-w-[90%] max-[700px]:left-4">
                            <div class="circle bg-white rounded-3xl absolute h-3 w-3 -bottom-1" ></div>
                        </div>
                        <div class="song_btns grid grid-cols-3 items-center w-full px-3 pb-2">
                            <div class="sName text-white"> </div>
                            <div class="play flex justify-center cursor-pointer max-[400px]:pb-7">
                                <div class="prev "> <img id="previous" class="invert w-9" src="/src/images/prev.svg" alt=""></div>
                                <div class="play"> <img id="playbtn" class="invert w-9"  src="/src/images/play.svg" alt=""></div>
                                <div class="next"> <img id="nextbtn" class="invert w-9"  src="/src/images/next.svg" alt=""></div>
                            </div>

                            <div class="flex-col gap-4 justify-end "> 

                                <div class="volume text-white text-right flex justify-end items-center gap-4 max-[400px]:gap-2 ">
                                    <img class="invert cursor-pointer" src="/src/images/volume.svg" alt="">
                                    <div class="songTime text-white text-right min-w-6 max-[440px]:text-left"> </div>
                                </div>

                                <div class="text-end ">
                                    <input class="max-[500px]:max-w-20 cursor-pointer " type="range" name="volume" id="range">
                                </div>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
     </div>
     <script src="/src/spotify.js"></script>
</body>
</html>
